name: Desktop Windows - pruebas y compilación
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Comprobar sintaxis
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar el motor de animación para las pruebas
        run: python -m pip install --disable-pip-version-check -r animation/requirements.txt
      - name: Ejecutar pruebas automatizadas
        run: npm test
      - name: Preparar Chromium para la grabadora móvil
        run: npx playwright install chromium
      - name: Crear instalador Windows
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Instalar y probar la aplicación en Windows
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "dist/11-Records-Studio-Setup-$version.exe"
          $installed = $null
          foreach ($attempt in 1..2) {
            $folder = Join-Path $env:RUNNER_TEMP "11-Records-Studio-instalado-$attempt"
            Write-Host "Instalando $($installer.Name) en $folder"
            $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$folder") -PassThru -Wait
            if ($process.ExitCode -eq 0) {
              $installed = Get-ChildItem $folder/*.exe | Where-Object Name -notmatch '^Uninstall' | Select-Object -First 1
              if ($installed) { break }
            }
            Write-Warning "Intento $attempt · NSIS devolvió $($process.ExitCode)"
          }
          if (-not $installed) { throw 'El instalador no pudo preparar el ejecutable' }
          $env:RECORDS_DESKTOP_EXECUTABLE = $installed.FullName
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:direct
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: 11-records-studio-windows
          path: |
            dist/11-Records-Studio-Setup-*.exe
            dist/11-Records-Studio-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 11-records-studio-windows
          path: release
      - name: Publicar la versión validada para el actualizador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Versión de publicación inválida' }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY > $null 2>&1
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $assets = @(Get-ChildItem release/* | Where-Object { $_.Name -match '\.exe(\.blockmap)?$|^latest\.yml$' } | ForEach-Object FullName)
          if (($assets | Where-Object { $_ -match '\.exe$' }).Count -ne 1 -or
              -not (Test-Path release/latest.yml)) { throw 'Faltan los archivos de actualización' }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "11 Récords Studio $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
