name: Desktop Windows - pruebas y compilación
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar sintaxis
        run: npm run check
      - name: Ejecutar pruebas automatizadas
        run: npm test
      - name: Crear instalador Windows
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: 11-records-studio-windows
          path: dist/*.exe
          if-no-files-found: error
