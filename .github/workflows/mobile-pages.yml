name: Grabadora móvil y Shorts - GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'grabador/**'
      - 'shorts/**'
      - 'assets/**'
      - 'scripts/build-pages.cjs'
      - 'web-vendor/package*.json'
      - '.github/mobile-pages-index.html'
      - '.github/workflows/mobile-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: grabadora-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/configure-pages@v6
      - name: Probar la lógica de Shorts
        run: node --test tests/shorts-core.test.cjs
      - name: Instalar las librerías del navegador (Whisper)
        run: npm ci --prefix web-vendor --ignore-scripts --no-audit --no-fund
      - name: Preparar la página
        run: node scripts/build-pages.cjs site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
